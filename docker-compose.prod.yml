services:
  postgres:
    image: postgres:16-alpine
    container_name: soc_telemetry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soc_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: soc_analytics_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_REQUIRED: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_password}@postgres:5432/${POSTGRES_DB:-soc_telemetry}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_password}@postgres:5432/${POSTGRES_DB:-soc_telemetry}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,https://13.201.137.162,http://13.201.137.162}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      RATE_LIMIT_ENABLED: "true"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ZEEK_SPOOL_ENABLED: ${ZEEK_SPOOL_ENABLED:-false}
      ZEEK_SPOOL_DIR: /opt/zeek/spool/zeek
      PCAP_MAX_UPLOAD_SIZE_MB: 50
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-netsentinel_session}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-480}
    volumes:
      # Read-only bind mount for frozen Stage 3 model artifacts
      - ./artifacts/models:/app/artifacts/models:ro
      # Shared spool volume for Zeek real-time ingestion
      - zeek_spool_data:/opt/zeek/spool/zeek
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - soc_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: soc_dashboard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - soc_net

volumes:
  postgres_data:
    driver: local
  zeek_spool_data:
    driver: local

networks:
  soc_net:
    driver: bridge
