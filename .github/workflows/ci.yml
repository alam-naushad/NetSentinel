name: CI Pipeline

on:
  push:
    branches: [ master, main, stage-* ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Regression & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migration Head
        run: |
          alembic -c backend/alembic.ini heads

      - name: Run Backend Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production SPA Bundle
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Backend Container
        run: |
          docker build -t soc-backend:ci -f Dockerfile.backend .

      - name: Build Frontend Container
        run: |
          docker build -t soc-frontend:ci -f Dockerfile.frontend .
