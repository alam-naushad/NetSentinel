services:
  postgres:
    image: postgres:16-alpine
    container_name: soc_telemetry_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d ${POSTGRES_DB:-soc_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soc_dev_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: soc_analytics_backend_dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_REQUIRED: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_password}@postgres:5432/${POSTGRES_DB:-soc_telemetry}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-soc_user}:${POSTGRES_PASSWORD:-soc_password}@postgres:5432/${POSTGRES_DB:-soc_telemetry}
      CORS_ORIGINS: "*"
      ENABLE_HTTPS: "false"
      RATE_LIMIT_ENABLED: "true"
      LOG_FORMAT: console
      ZEEK_SPOOL_ENABLED: "false"
      ZEEK_SPOOL_DIR: /opt/zeek/spool/zeek
      PCAP_MAX_UPLOAD_SIZE_MB: 50
    volumes:
      # Read-only bind mount for model artifacts
      - ./artifacts/models:/app/artifacts/models:ro
      # Spool volume for Zeek ingestion
      - zeek_spool_dev_data:/opt/zeek/spool/zeek
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - soc_dev_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: soc_dashboard_frontend_dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soc_dev_net

volumes:
  postgres_dev_data:
    driver: local
  zeek_spool_dev_data:
    driver: local

networks:
  soc_dev_net:
    driver: bridge
